name: Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/api
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install cargo-lambda
        env:
          VERSION: v1.9.2
          SHA256: b5c258c424ebaef39541c3641f33c51137ee6c426016f365628fedb2c737271d
        run: |
          curl -fsSLo cargo-lambda.tar.gz "https://github.com/cargo-lambda/cargo-lambda/releases/download/${VERSION}/cargo-lambda-${VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA256}  cargo-lambda.tar.gz" | sha256sum --check
          tar -xzf cargo-lambda.tar.gz -C ~/.cargo/bin
          rm cargo-lambda.tar.gz
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec nx format:check --all
      - name: Check
        run: pnpm check
      - name: Test DynamoDB session persistence
        env:
          AWS_ACCESS_KEY_ID: localtest
          AWS_SECRET_ACCESS_KEY: localtest
          AWS_REGION: us-east-2
          AWS_EC2_METADATA_DISABLED: 'true'
          DYNAMODB_ENDPOINT_URL: http://localhost:8000
          TABLE_NAME: math-on-the-go-ci
        run: |
          aws dynamodb create-table \
            --endpoint-url "$DYNAMODB_ENDPOINT_URL" \
            --table-name "$TABLE_NAME" \
            --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST
          aws dynamodb wait table-exists \
            --endpoint-url "$DYNAMODB_ENDPOINT_URL" \
            --table-name "$TABLE_NAME"
          cargo test --manifest-path apps/api/Cargo.toml --locked --test session_persistence -- --ignored --nocapture
      - name: Build frontend and ARM64 Lambda binaries
        run: pnpm build
      - name: Synthesize without AWS credentials or application secrets
        run: pnpm exec cdk synth --strict --quiet
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          CDK_DEFAULT_ACCOUNT: '000000000000'
          AWS_REGION: us-east-2
          STAGE: prod
      - name: Upload deployment build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/apps/web/browser
            apps/api/target/lambda/api
            apps/api/target/lambda/worker
          if-no-files-found: error
          retention-days: 7
